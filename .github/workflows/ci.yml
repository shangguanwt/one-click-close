name: CI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - 'Directory.Build.props'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'OneClickClose.sln'
      - 'close-user-apps.config.json'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'Directory.Build.props'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'docs/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'OneClickClose.sln'
      - 'close-user-apps.config.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_CONFIGURATION: Release
  RUNTIME_IDENTIFIER: win-x64

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore OneClickClose.sln -p:RuntimeIdentifier=${{ env.RUNTIME_IDENTIFIER }}

      - name: Test
        timeout-minutes: 8
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          dotnet test tests\OneClickClose.Core.Tests\OneClickClose.Core.Tests.csproj `
            -c $env:BUILD_CONFIGURATION `
            --no-restore `
            -p:RuntimeIdentifier=$env:RUNTIME_IDENTIFIER `
            --logger "trx;LogFileName=core-tests.trx" `
            --results-directory test-results `
            --diag test-results\vstest.log `
            --blame-hang `
            --blame-hang-timeout 5m

      - name: Build WinUI
        run: dotnet build src\OneClickClose.WinUI\OneClickClose.WinUI.csproj -c $env:BUILD_CONFIGURATION --no-restore -p:RuntimeIdentifier=$env:RUNTIME_IDENTIFIER

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
