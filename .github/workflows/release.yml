name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Resolve version from tag
      id: ver
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        Write-Host "Version: $version"
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Build self-contained WinUI 3 package
      shell: pwsh
      run: .\scripts\build-winui.ps1 -SelfContained -Version ${{ steps.ver.outputs.version }} -Platform x64

    - name: Extract release notes from CHANGELOG
      id: notes
      shell: pwsh
      run: |
        $version = "${{ steps.ver.outputs.version }}"
        $path = "release-notes.md"
        if (Test-Path "CHANGELOG.md") {
          $lines = Get-Content "CHANGELOG.md"
          $start = $null; $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## \[$([regex]::Escape($version))\]") { $start = $i + 1; continue }
            if ($null -ne $start -and $lines[$i] -match "^## \[") { $end = $i; break }
          }
          if ($null -ne $start) {
            $lines[$start..($end - 1)] | Out-File -FilePath $path -Encoding utf8
          }
        }
        if (-not (Test-Path $path) -or (Get-Item $path).Length -eq 0) {
          "See commit history for changes in v$version." | Out-File -FilePath $path -Encoding utf8
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: release-notes.md
        files: |
          release/OneClickClose.WinUI-${{ steps.ver.outputs.version }}-x64.zip
        fail_on_unmatched_files: false
